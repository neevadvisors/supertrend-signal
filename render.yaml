# Scheduled coverage jobs: use a worker service with `docker-entrypoint.sh worker`
# and backend/crontab (IN hourly + US RTH hourly). Manual one-shot:
# `python scripts/run_coverage_signals.py --market IN|US|ALL`
services:
  - type: web
    name: neev-signals-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DHAN_CLIENT_ID
        sync: false
      - key: DHAN_PIN
        sync: false
      - key: DHAN_TOTP_SECRET
        sync: false
      - key: DHAN_ACCESS_TOKEN
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: ALPACA_API_KEY
        sync: false
      - key: ALPACA_SECRET_KEY
        sync: false
      - key: US_MARKET_ENABLED
        sync: false
    buildFilter:
      paths:
        - backend/**
