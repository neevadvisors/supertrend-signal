services:
  - type: web
    name: dhan-signals-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DHAN_CLIENT_ID
        sync: false
      - key: DHAN_PIN
        sync: false
      - key: DHAN_TOTP_SECRET
        sync: false
      - key: DHAN_ACCESS_TOKEN
        sync: false
      - key: CORS_ORIGINS
        sync: false
    buildFilter:
      paths:
        - backend/**
