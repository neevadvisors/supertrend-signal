services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: dhan
      POSTGRES_PASSWORD: dhan
      POSTGRES_DB: signals
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dhan -d signals"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg://dhan:dhan@postgres:5432/signals
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s
    command: ["api"]

  worker:
    build:
      context: ./backend
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg://dhan:dhan@postgres:5432/signals
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_healthy
    command: ["worker"]

volumes:
  pgdata:
