# Production-ish Compose for the single EC2 host (RDS is external — no local Postgres).
# Run from repo root on the instance:
#   docker compose -f docker-compose.aws.yml up -d --build
services:
  api:
    build:
      context: ./backend
    env_file:
      - ./backend/.env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    command: ["api"]

  worker:
    build:
      context: ./backend
    env_file:
      - ./backend/.env
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    command: ["worker"]

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost}
    env_file:
      - ./frontend/.env
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
    depends_on:
      - api
      - frontend
